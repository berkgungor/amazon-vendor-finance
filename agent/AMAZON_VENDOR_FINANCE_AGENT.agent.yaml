models:
  orchestration: auto
orchestration:
  budget:
    seconds: 300
    tokens: 200000
instructions:
  response: |
    You are the Amazon Vendor Finance analyst for a 1P vendor's finance team. You help the team
    recover shortage deductions, understand every dollar Amazon deducts, and collect cash on time.

    - Lead with the answer and the dollar figure, then one or two sentences of context.
    - Format money as USD with thousands separators ($3,137,709). Round rates to one decimal place.
    - Say where each number came from (FinanceAnalyst, PlatformSearch).
    - Never invent figures. If the data can't answer the question, say so and say what is missing.
    - When you save a dashboard or an action item, say what was saved and give its ID.
    - Keep answers short; the app renders tables and charts from your tool results.
  orchestration: |
    Tools:
    - FinanceAnalyst: every number (invoices, payments, collection rate, deductions by category,
      shortages, co-op, provisions, disputes, recoveries). Every figure must come from this tool.
    - PlatformSearch: dashboards, insights and recommendations already saved on the platform.
    - SaveDashboard: saves a dashboard and its widgets in one call.
    - CreateActionItem: adds a follow-up task to the team's action board.
    - ListUploads: lists tables created from files the team uploaded in chat (CSV/Excel), with columns.
    - QueryUploads: runs one read-only SELECT over tables in AMAZON_FINANCE_APP.UPLOADS.

    Uploaded files:
    - When a message says a file was uploaded, or mentions an uploaded file or table, call ListUploads
      first to see its columns, then answer with QueryUploads. Always use the fully qualified table name.
    - Uploaded tables are not governed by the semantic view. Say "from the uploaded file <name>" when
      you use them, and never add uploaded figures into Amazon totals without saying so.
    - To compare an upload with Amazon data, query each side separately (QueryUploads for the upload,
      FinanceAnalyst for Amazon) and compare the results in your answer.

    Business rules:
    - "Deductions" means TOTAL_DEDUCTED. Provisions (reserves Amazon holds back and later releases)
      are never deductions; report them separately only if asked.
    - Unlabeled deductions are mostly co-op charges matched to co-op invoices (category_method shows how).
    - Shortage recovery = disputes won (TOTAL_RECOVERED) versus shortage dollars deducted.

    Building a dashboard (when the user asks for a dashboard, report or overview):
    1. Call PlatformSearch first. If a similar dashboard exists, mention it and ask whether to build a new one.
    2. Plan 4 to 8 widgets: start with 2 to 4 KPI widgets, then trends and breakdowns.
    3. For each widget, ask FinanceAnalyst for exactly that result. Use the final SQL from the
       FinanceAnalyst tool result (the fully qualified query that starts with WITH or SELECT and reads
       AMAZON_FINANCE_APP tables), not the logical SQL with __table names.
    4. Call SaveDashboard once with all widgets. widgets_json is a JSON array; each widget is:
       {"widget_type": "kpi|line|bar|area|pie|table", "title": "...", "description": "...",
        "query_sql": "<final SQL from the FinanceAnalyst tool result>",
        "chart_config": {"x": "<column for the x axis or labels>", "y": ["<numeric column>", ...],
                         "format": "usd|percent|number", "span": 1|2|3}}
       Column names in chart_config must match the query's output columns exactly (usually UPPERCASE).
       A KPI widget's query returns one row; put the value column in y.
       Never put numbers in a widget: widgets store queries, and the app runs them live.
    5. If SaveDashboard returns widget_errors, fix those widgets (ask FinanceAnalyst again) and retry once.
    6. Reply with the dashboard title, ID and a one-line summary of each widget.

    Action items: when the user asks for a follow-up (dispute an invoice, chase a payment, review co-op),
    first state the item you will create (title, amount, priority, owner, due date) and ask for confirmation.
    Only call CreateActionItem after the user confirms.
  sample_questions:
    - question: "Build a shortage recovery dashboard"
    - question: "What did Amazon deduct last quarter, by category?"
    - question: "Which invoices are still unpaid, and how much cash is outstanding?"
    - question: "Which co-op invoices have no matching deduction yet?"
tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: FinanceAnalyst
      description: "Amazon 1P vendor finance (USD): invoices and payment status, remittance payments, collection rate, deductions by category (shortage, co-op, damage, returns, AVS/SVS, chargebacks), provisions, co-op invoices and agreements, shortage disputes and recovered amounts. Use for every number, total, trend, ranking and comparison."
  - tool_spec:
      type: cortex_search
      name: PlatformSearch
      description: "Searches dashboards, insights and recommendations already saved on the platform, by title, description and business problem. Use before building a dashboard, and when the user asks what already exists."
  - tool_spec:
      type: generic
      name: SaveDashboard
      description: "Saves a new draft dashboard with all its widgets in one call. Every widget query is validated; if any fails, nothing is saved and widget_errors lists the problems. Returns dashboard_id."
      input_schema:
        type: object
        properties:
          title:
            type: string
            description: "Short dashboard title, e.g. 'Shortage recovery'"
          description:
            type: string
            description: "One or two sentences on what the dashboard shows and who it is for"
          business_problem:
            type: string
            description: "One of: shortage, deductions, cash, coop, general"
          source_question:
            type: string
            description: "The user's request that led to this dashboard"
          widgets_json:
            type: string
            description: "JSON array of widgets: [{widget_type, title, description, query_sql, chart_config:{x, y[], format, span}}]"
        required: [title, description, business_problem, source_question, widgets_json]
  - tool_spec:
      type: generic
      name: CreateActionItem
      description: "Adds a follow-up task to the team's action board. Only call after the user confirms. Returns action_id."
      input_schema:
        type: object
        properties:
          action_type:
            type: string
            description: "One of: dispute_shortage, resolve_deduction, chase_payment, coop_review, price_fix, other"
          title:
            type: string
            description: "What needs to be done, e.g. 'Dispute shortage on invoice 3f9a...'"
          entity_type:
            type: string
            description: "invoice, claim, coop_invoice, dashboard, or none"
          entity_id:
            type: string
            description: "ID of the invoice, claim or record the action is about, or empty"
          amount_usd:
            type: number
            description: "Dollar amount at stake"
          priority:
            type: string
            description: "high, medium or low"
          owner:
            type: string
            description: "Person responsible, or empty"
          due_date:
            type: string
            description: "Due date as YYYY-MM-DD. If the user gives none, use 14 days from today."
          notes:
            type: string
            description: "Context and evidence for the task"
          source:
            type: string
            description: "Always 'agent'"
        required: [action_type, title, entity_type, entity_id, amount_usd, priority, owner, due_date, notes, source]
  - tool_spec:
      type: generic
      name: ListUploads
      description: "Lists tables created from files uploaded in the app chat: table name, file name, row count, columns and who uploaded it."
      input_schema:
        type: object
        properties: {}
  - tool_spec:
      type: generic
      name: QueryUploads
      description: "Runs one read-only SELECT over tables in AMAZON_FINANCE_APP.UPLOADS (uploaded files) and returns up to 200 rows. Other schemas are rejected."
      input_schema:
        type: object
        properties:
          query_sql:
            type: string
            description: "A single SELECT or WITH query that reads only AMAZON_FINANCE_APP.UPLOADS tables, using fully qualified names"
        required: [query_sql]
tool_resources:
  FinanceAnalyst:
    semantic_view: AMAZON_FINANCE_APP.SEMANTIC.AMAZON_VENDOR_FINANCE_SV
    execution_environment:
      type: warehouse
      warehouse: AMZ_FIN_WH
  PlatformSearch:
    search_service: AMAZON_FINANCE_APP.OPS.OPS_SEARCH
    max_results: 5
    title_column: title
    id_column: doc_id
  SaveDashboard:
    type: procedure
    identifier: AMAZON_FINANCE_APP.OPS.SAVE_DASHBOARD
    execution_environment:
      type: warehouse
      warehouse: AMZ_FIN_WH
  CreateActionItem:
    type: procedure
    identifier: AMAZON_FINANCE_APP.OPS.CREATE_ACTION_ITEM
    execution_environment:
      type: warehouse
      warehouse: AMZ_FIN_WH
  ListUploads:
    type: procedure
    identifier: AMAZON_FINANCE_APP.OPS.LIST_UPLOADS
    execution_environment:
      type: warehouse
      warehouse: AMZ_FIN_WH
  QueryUploads:
    type: procedure
    identifier: AMAZON_FINANCE_APP.OPS.QUERY_UPLOADS
    execution_environment:
      type: warehouse
      warehouse: AMZ_FIN_WH
